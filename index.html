<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075b42">
<title>পাক্কা মসজিদ হিসাব</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f2;margin:0;color:#17352b}
header{background:#075b42;color:white;padding:22px 16px;text-align:center}
main{max-width:650px;margin:auto;padding:15px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#087b56;color:white;border:0;font-weight:bold}
.total{font-size:20px;font-weight:bold;color:#087b56}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<header>
<h2>পাক্কা মসজিদ</h2>
<div>মসজিদ আল-জামিয়াতুল ফাতাহ</div>
<p>আয়-ব্যয়ের প্রাথমিক হিসাব</p>
</header>
<main>
<div class="card">
<h3>হিসাব যোগ করুন</h3>
<select id="type">
<option value="in">আয়</option>
<option value="out">ব্যয়</option>
</select>
<input id="desc" placeholder="বিবরণ / দাতার নাম">
<input id="amount" type="number" min="1" placeholder="টাকার পরিমাণ">
<input id="date" type="date">
<button onclick="addEntry()">হিসাব সংরক্ষণ</button>
</div>
<div class="card">
<h3>মোট হিসাব</h3>
<p>মোট আয়: <span class="total" id="income">০</span> টাকা</p>
<p>মোট ব্যয়: <span class="total" id="expense">০</span> টাকা</p>
<p>বর্তমান জমা: <span class="total" id="balance">০</span> টাকা</p>
</div>
<div class="card">
<h3>হিসাবের তালিকা</h3>
<div id="list">এখনো কোনো হিসাব যোগ করা হয়নি।</div>
<button onclick="exportData()">হিসাব ব্যাকআপ ডাউনলোড</button>
<p class="small">এই প্রাথমিক সংস্করণে তথ্য শুধু এই ব্রাউজারেই থাকে। অনলাইন ব্যাকআপ এখনো যুক্ত হয়নি।</p>
</div>
</main>
<script>
const key='pakkaMosjidEntries';
let entries=JSON.parse(localStorage.getItem(key)||'[]');
document.getElementById('date').value=new Date().toISOString().slice(0,10);
function money(n){return Number(n).toLocaleString('bn-BD')}
function save(){localStorage.setItem(key,JSON.stringify(entries));render()}
function addEntry(){
 const type=document.getElementById('type').value;
 const desc=document.getElementById('desc').value.trim();
 const amount=Number(document.getElementById('amount').value);
 const date=document.getElementById('date').value;
 if(!desc||amount<=0||!date){alert('বিবরণ, সঠিক টাকার পরিমাণ ও তারিখ দিন।');return}
 entries.unshift({type,desc,amount,date});
 save();
 document.getElementById('desc').value='';
 document.getElementById('amount').value='';
 alert('এই ব্রাউজারে হিসাব সংরক্ষিত হয়েছে।');
}
function render(){
 let inc=0,out=0;
 entries.forEach(e=>{if(e.type==='in')inc+=e.amount;else out+=e.amount});
 document.getElementById('income').textContent=money(inc);
 document.getElementById('expense').textContent=money(out);
 document.getElementById('balance').textContent=money(inc-out);
 const list=document.getElementById('list');
 if(!entries.length){list.textContent='এখনো কোনো হিসাব যোগ করা হয়নি।';return}
 list.innerHTML='';
 entries.forEach((e,i)=>{
  const d=document.createElement('div');
  d.className='card';
  d.textContent=(e.type==='in'?'আয়':'ব্যয়')+' — '+e.desc+' — '+money(e.amount)+' টাকা — '+e.date;
  const b=document.createElement('button');
  b.textContent='এই হিসাব মুছুন';
  b.onclick=()=>{if(confirm('হিসাবটি মুছবেন?')){entries.splice(i,1);save()}};
  d.appendChild(b);list.appendChild(d);
 });
}
function exportData(){
 const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='pakka-mosjid-backup.json';a.click();
 URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
